<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机构级 4 大价值模型套利 & 全球能源需求终端</title>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc;
      --text-sub: #94a3b8; --green: #22c55e; --red: #ef4444; --border: #334155; --accent: #38bdf8; --star: #f59e0b;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 8px; }
    .section-title { font-size: 17px; font-weight: bold; margin: 24px 0 12px 0; color: var(--accent); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .toolbar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 16px; }
    .subtitle { font-size: 13px; color: var(--text-sub); }
    .btn-refresh { background: var(--accent); color: #0f172a; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    
    /* 需求仪表盘样式 */
    .dashboard-panel { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--accent); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .top-demand-banner { font-size: 15px; font-weight: bold; color: var(--star); margin-bottom: 12px; display: flex; justify-content: space-between; }
    .demand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .demand-item { background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; }
    .demand-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; color: var(--text); }
    .demand-score { color: #f43f5e; font-weight: bold; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
    .category-tag { font-size: 11px; background: rgba(148,163,184,0.15); color: var(--text-sub); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .star-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 18px; }
    .star-btn.starred { color: var(--star); }
    .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-right: 24px; }
    .stock-name { font-weight: bold; font-size: 15px; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-sub); }
    .info-val { color: var(--text); font-weight: 500; }
    .actual-price { color: var(--accent); font-weight: bold; font-size: 14px; }
    .highlight-val { color: #f59e0b; font-weight: bold; font-size: 14px; }
    .badge { padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; text-align: center; margin-top: 10px; }
    .green { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid var(--green); }
    .red { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid var(--red); }
    .neutral { background: rgba(148,163,184,0.1); color: var(--text-sub); border: 1px solid var(--border); }
    .empty-msg { color: var(--text-sub); font-size: 13px; text-align: center; grid-column: 1 / -1; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏛️ 机构级 4 大价值模型 & 全球能源需求终端</h1>
    
    <div class="toolbar">
      <div class="subtitle" id="update-time">数据加载中...</div>
      <button class="btn-refresh" onclick="fetchTrackerData()">⚡ 刷新数据</button>
    </div>

    <!-- 能源需求仪表盘 -->
    <div class="dashboard-panel">
      <div class="top-demand-banner">
        <span>🔥 当前全球需求最旺盛原料：<span id="top-material" style="color:#38bdf8;">拉取中...</span></span>
        <span style="font-size:12px; color:var(--text-sub);">已按需求量大小优先级对潜力股排序</span>
      </div>
      <div class="demand-grid" id="demand-grid"></div>
    </div>

    <!-- 收藏区 -->
    <div class="section-title">⭐ 我的核心自选股</div>
    <div class="grid" id="favorites-container"></div>

    <!-- 低吸发现区 -->
    <div class="section-title">🔍 全网盘中低吸潜力股扫描区 (优先检索高需求原料股)</div>
    <div class="grid" id="discovered-container"></div>

    <!-- 核心监控区 -->
    <div class="section-title">📊 核心资源监控池 (实际股价 vs 4大模型内在价值)</div>
    <div class="grid" id="cards-container"></div>
  </div>

  <script>
    let favoriteTickers = JSON.parse(localStorage.getItem('fav_tickers') || '[]');

    function toggleFavorite(ticker) {
      if (favoriteTickers.includes(ticker)) {
        favoriteTickers = favoriteTickers.filter(t => t !== ticker);
      } else {
        favoriteTickers.push(ticker);
      }
      localStorage.setItem('fav_tickers', JSON.stringify(favoriteTickers));
      fetchTrackerData();
    }

    function createCardHTML(item) {
      const isFav = favoriteTickers.includes(item.ticker);
      let signalClass = 'neutral';
      if(item.signal.includes('低吸')) signalClass = 'green';
      if(item.signal.includes('追高')) signalClass = 'red';

      return `
        <div class="card">
          <button class="star-btn ${isFav ? 'starred' : ''}" onclick="toggleFavorite('${item.ticker}')">★</button>
          <span class="category-tag">${item.category} | 需求热度:${item.demand_score}</span>
          <div class="stock-header">
            <span class="stock-name">${item.stock_name} (${item.ticker})</span>
          </div>
          <div class="info-row">
            <span>当前实际股价:</span>
            <span class="actual-price">${item.stock_price} <small style="font-size:11px; color:${item.change_pct.includes('-')?'#ef4444':'#22c55e'}">(${item.change_pct})</small></span>
          </div>
          <div class="info-row">
            <span>4大模型内在价值:</span>
            <span class="highlight-val">${item.implied_price}</span>
          </div>
          <div style="border-top: 1px dashed var(--border); margin: 8px 0;"></div>
          <div class="info-row">
            <span>上游现货价 (P):</span>
            <span class="info-val">${item.commodity_price}</span>
          </div>
          <div class="info-row">
            <span>生产成本线 (C):</span>
            <span class="info-val">${item.cost_line}</span>
          </div>
          <div class="badge ${signalClass}">${item.signal}</div>
        </div>
      `;
    }

    async function fetchTrackerData() {
      const timeElem = document.getElementById('update-time');
      timeElem.innerText = '拉取最新数据中...';

      try {
        const res = await fetch('./latest_data.json?t=' + Date.now(), { cache: 'no-store' });
        const json = await res.json();
        
        timeElem.innerText = `数据时间：${json.updated_at} (核心监控 ${json.total_items} 个 | 扫描低吸 ${json.discovered_count} 个)`;
        document.getElementById('top-material').innerText = json.top_demand_material;

        // 渲染需求仪表盘
        const demandGrid = document.getElementById('demand-grid');
        demandGrid.innerHTML = '';
        for (const [key, item] of Object.entries(json.demand_dashboard)) {
          demandGrid.innerHTML += `
            <div class="demand-item">
              <div class="demand-header">
                <span>${item.name}</span>
                <span class="demand-score">指数:${item.demand_score}</span>
              </div>
              <div style="color:var(--text-sub); margin-bottom:2px;">现货: ${item.price} ${item.unit}</div>
              <div style="color:#64748b; font-size:11px;">${item.desc}</div>
            </div>
          `;
        }

        const favContainer = document.getElementById('favorites-container');
        const discContainer = document.getElementById('discovered-container');
        const coreContainer = document.getElementById('cards-container');

        favContainer.innerHTML = '';
        discContainer.innerHTML = '';
        coreContainer.innerHTML = '';

        const allItems = [...json.data, ...(json.discovered_data || [])];
        const favItems = allItems.filter(item => favoriteTickers.includes(item.ticker));

        if (favItems.length === 0) {
          favContainer.innerHTML = '<div class="empty-msg">暂无自选标的，点击卡片右上角 ★ 收藏关注。</div>';
        } else {
          favItems.forEach(item => favContainer.innerHTML += createCardHTML(item));
        }

        if (!json.discovered_data || json.discovered_data.length === 0) {
          discContainer.innerHTML = '<div class="empty-msg">本次全网扫描未发现符合 4 大模型低吸信号的标的。</div>';
        } else {
          json.discovered_data.forEach(item => discContainer.innerHTML += createCardHTML(item));
        }

        json.data.forEach(item => coreContainer.innerHTML += createCardHTML(item));

      } catch (e) {
        timeElem.innerText = '加载失败。';
      }
    }

    fetchTrackerData();
  </script>
</body>
</html>
