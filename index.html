<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全周期资源/大宗商品套利实时监控系统</title>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc;
      --text-sub: #94a3b8; --green: #22c55e; --red: #ef4444; --border: #334155;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .category-tag { font-size: 11px; background: rgba(148,163,184,0.15); color: var(--text-sub); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .stock-name { font-weight: bold; font-size: 15px; }
    .stock-price { font-size: 16px; font-weight: bold; color: #38bdf8; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-sub); }
    .info-val { color: var(--text); font-weight: 500; }
    .badge { padding: 8px; border-radius: 6px; font-weight: bold; font-size: 12px; text-align: center; margin-top: 10px; }
    .green { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid var(--green); }
    .red { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid var(--red); }
    .neutral { background: rgba(148,163,184,0.1); color: var(--text-sub); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ 大宗商品与资源周期套利监控面板</h1>
    <div class="subtitle" id="update-time">数据刷新中...</div>

    <div class="grid" id="cards-container">
      <!-- 动态数据填充区域 -->
    </div>
  </div>

  <script>
    async function fetchTrackerData() {
      try {
        const res = await fetch('./latest_data.json?t=' + Date.now());
        const json = await res.json();
        
        document.getElementById('update-time').innerText = `上次自动同步：${json.updated_at} (共监控 ${json.total_items || json.data.length} 个标的)`;
        
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        json.data.forEach(item => {
          let signalClass = 'neutral';
          if(item.signal.includes('低吸')) signalClass = 'green';
          if(item.signal.includes('追高')) signalClass = 'red';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <span class="category-tag">${item.category}</span>
            <div class="stock-header">
              <span class="stock-name">${item.stock_name}</span>
              <span class="stock-price">${item.stock_price} <small style="font-size:10px; color:${item.change_pct.includes('-')?'#ef4444':'#22c55e'}">${item.change_pct}</small></span>
            </div>
            <div class="info-row">
              <span>关联大宗现货/期货:</span>
              <span class="info-val">${item.commodity_price}</span>
            </div>
            <div class="info-row">
              <span>乖离率比率指数:</span>
              <span class="info-val">${item.ratio_index}</span>
            </div>
            <div class="badge ${signalClass}">${item.signal}</div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        document.getElementById('update-time').innerText = '数据加载失败，请重试或检查后台脚本输出。';
      }
    }

    fetchTrackerData();
  </script>
</body>
</html>
