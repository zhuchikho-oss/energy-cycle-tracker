name: Energy Cycle Daily Tracker

on:
  schedule:
    # UTC 8:30 = 北京/香港时间 16:30 (收盘后)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests beautifulsoup4 pandas lxml

    - name: Run Energy Cycle Tracker
      run: python tracker.py

    - name: Commit and Push Updated Data
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update energy cycle data [skip ci]"
        file_pattern: "latest_data.json"