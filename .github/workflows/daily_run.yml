name: Energy Cycle Daily Tracker

on:
  schedule:
    # UTC 8:30 = 北京/香港时间 16:30 (收盘后)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 拉取完整提交历史，避免浅克隆导致 rebase 失败

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests beautifulsoup4 pandas lxml

    - name: Run Energy Cycle Tracker
      run: python tracker.py

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add latest_data.json
        git commit -m "Auto-update energy cycle data [skip ci]" || exit 0
        git pull --rebase origin main || git rebase --skip
        git push origin main