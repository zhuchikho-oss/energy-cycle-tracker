name: Energy Cycle Daily Tracker

on:
  schedule:
    - cron: '30 8 * * 1-5' # 每个交易日北京时间 16:30 自动运行
  workflow_dispatch: # 支持网页端手动触发运行

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，避免变基冲突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run Tracker Script
        run: python tracker.py

      - name: Pull latest remote changes before commit
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main || true

      - name: Auto Commit Updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update energy cycle data [skip ci]"
          file_pattern: "latest_data.json"
          push_options: "--force"